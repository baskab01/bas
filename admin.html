<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | BAS SHOP</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js" defer></script>
<script src="js/admin.js" defer></script>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><b>BAS</b> SHOP <small>ADMIN</small></a>
  <nav><a href="index.html">ดูร้าน</a><button id="logout" class="ghost-btn">ออกจากระบบ</button></nav>
</header>
<main class="admin-wrap">
  <div class="section-head"><div><div class="eyebrow">CONTROL PANEL</div><h1>จัดการสินค้า</h1></div></div>
  <section class="panel">
    <h2 id="form-title">เพิ่มสินค้า</h2>
    <form id="product-form" class="admin-form">
      <input type="hidden" id="product-id">
      <div class="two">
        <div><label>ชื่อสินค้า</label><input id="p-name" required></div>
        <div><label>ราคา</label><input id="p-price" type="number" min="0" step="0.01" required></div>
      </div>
      <div class="two">
        <div><label>Stock</label><input id="p-stock" type="number" min="0" step="1" required></div>
        <div><label>รูปภาพ (ชื่อไฟล์หรือ URL)</label><input id="p-image" placeholder="ghost.png"></div>
      </div>
      <label>รายละเอียด</label><textarea id="p-description" rows="4"></textarea>
      <div class="row">
        <button class="primary" type="submit">บันทึกสินค้า</button>
        <button class="ghost-btn" type="button" id="cancel-edit">ยกเลิก</button>
      </div>
      <div id="admin-message" class="message"></div>
    </form>
  </section>

  <section class="panel">
    <div class="section-head"><h2>สินค้าปัจจุบัน</h2><button class="ghost-btn" onclick="loadAdminProducts()">รีเฟรช</button></div>
    <div id="admin-products" class="admin-list"></div>
  </section>
</main>
</body>
</html>
