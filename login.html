<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | BAS SHOP</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js" defer></script>
<script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
<div class="auth-card">
  <a class="brand center" href="index.html"><b>BAS</b> SHOP</a>
  <h1>เข้าสู่ระบบ</h1>
  <p class="muted">เข้าสู่บัญชีของคุณ</p>
  <form id="login-form">
    <label>ชื่อผู้ใช้</label>
    <input id="login-username" autocomplete="username" required placeholder="เช่น bas123">
    <label>รหัสผ่าน</label>
    <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••">
    <button class="primary full" type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="login-message" class="message"></div>
  <p class="switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
  <a class="back" href="index.html">← กลับหน้าสินค้า</a>
</div>
</body>
</html>
